[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "hostname"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://x.x.x.x:8086"]
  token = "token"
  organization = "xyz"
  bucket = "xyz"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false
[[inputs.diskio]]
[[inputs.kernel]]
[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.net]]

[[inputs.sensors]]

[[inputs.execd]]
  startup_error_behavior = "probe"
  command = ["/zpool_libs/zpool_influxdb", "--execd"]
  environment = ["LD_LIBRARY_PATH=/zfs_libs"]
  signal = "STDIN"
  restart_delay = "10s"
  data_format = "influx"

[[inputs.zfs]]
 startup_error_behavior = "probe"
  kstatPath = "/hostfs/proc/spl/kstat/zfs"
  poolMetrics = false
  datasetMetrics = false

[[inputs.smart]]
  startup_error_behavior = "probe"
  timeout = "30s"
  attributes = true
  use_sudo = true
